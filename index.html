<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>加密创作讨论空间pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 20px auto; padding: 0 20px; }
        .hidden { display: none !important; }
        .layout { display: flex; gap: 20px; }
        #room-list { width: 30%; border-right: 1px solid #ccc; padding-right: 10px; }
        #chat-main { width: 70%; }
        .room-item { padding: 8px; margin-bottom: 5px; background: #eee; cursor: pointer; border-radius: 4px; }
        .room-item:hover { background: #ddd; }
        .room-item.active { background: #007bff; color: white; }
        #chat-box { height: 350px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
        .message { margin-bottom: 8px; }
        .message span { font-weight: bold; color: #007bff; }
    </style>
</head>
<body>

    <!-- 1. 登录视图 -->
    <div id="auth-section">
        <h2>空间登录</h2>
        <input type="email" id="email-input" placeholder="输入所有者分配的邮箱" style="width: 40%;" /><br><br>
        <input type="password" id="password-input" placeholder="输入密码" style="width: 40%;" /><br><br>
        <button onclick="login()">登录</button>
        <p id="auth-error" style="color: red;"></p>
    </div>

    <!-- 2. 聊天室主视图（登录后显示） -->
    <div id="chat-section" class="hidden">
        <h2>小说创作空间 
            <span id="current-room-title" style="font-size: 16px; color: #666; margin-left: 10px;"></span>
            <button onclick="logout()" style="float: right; font-size: 12px;">退出登录</button>
        </h2>

        <div class="layout">
            <!-- 左侧：房间列表 -->
            <div id="room-list">
                <h3>讨论隔间</h3>
                <div id="rooms-container"></div>
            </div>

            <!-- 右侧：聊天区域 -->
            <div id="chat-main">
                <div id="chat-box">请先在左侧选择一个房间</div>
                <div id="input-area" class="hidden">
                    <input type="text" id="message-input" placeholder="输入聊天内容..." style="width: 75%;" />
                    <button onclick="sendMessage()">发送</button>
                </div>
            </div>
        </div>

        <!-- 修改密码区 -->
        <div style="margin-top: 25px; padding: 10px; border: 1px dashed #ccc;">
            <input type="password" id="new-password-input" placeholder="输入新密码 (至少6位)" style="width: 45%;" />
            <button onclick="updatePassword()">修改我的密码</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pctuwkfztzmhlgjkeuvl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_RVSfnyjPqLw5fn30Tlm3ig_XIgJipuG';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentRoomId = null;
        let currentSubscription = null;

        checkUser();

        async function checkUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) { showChatRoom(); }
        }

        async function login() {
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;
            const errorTag = document.getElementById('auth-error');

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                errorTag.innerText = '登录失败: ' + error.message;
            } else {
                showChatRoom();
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            document.getElementById('chat-section').classList.add('hidden');
            document.getElementById('auth-section').classList.remove('hidden');
        }

        function showChatRoom() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('chat-section').classList.remove('hidden');
            loadRooms();
        }

        // 加载房间列表
        async function loadRooms() {
            const { data: rooms, error } = await supabaseClient.from('rooms').select('*').order('id');
            if (error) { console.error(error); return; }

            const container = document.getElementById('rooms-container');
            container.innerHTML = '';
            rooms.forEach(room => {
                const div = document.createElement('div');
                div.className = 'room-item';
                div.innerText = room.password ? `🔒 ${room.name}` : `💬 ${room.name}`;
                div.onclick = () => selectRoom(room);
                container.appendChild(div);
            });
        }

        // 选择房间并处理密码校验
        async function selectRoom(room) {
            // 如果房间有密码，弹窗要求输入
            if (room.password) {
                const inputPwd = prompt(`【${room.name}】是加密房间，请输入访问密码：`);
                if (inputPwd !== room.password) {
                    alert('密码错误，拒绝进入！');
                    return;
                }
            }

            currentRoomId = room.id;
            document.getElementById('current-room-title').innerText = `- 当前隔间：${room.name}`;
            document.getElementById('input-area').classList.remove('hidden');

            // 切换高亮样式
            document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');

            // 加载该房间历史消息并开启实时监听
            loadMessages(room.id);
            subscribeMessages(room.id);
        }

        async function loadMessages(roomId) {
            const chatBox = document.getElementById('chat-box');
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .eq('room_id', roomId)
                .order('created_at', { ascending: true })
                .limit(50);
            
            if (!error) {
                chatBox.innerHTML = '';
                data.forEach(msg => appendMessage(msg));
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function subscribeMessages(roomId) {
            if (currentSubscription) {
                supabaseClient.removeChannel(currentSubscription);
            }
            currentSubscription = supabaseClient
                .channel(`room:${roomId}`)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${roomId}` }, payload => {
                    appendMessage(payload.new);
                    document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
                })
                .subscribe();
        }

        async function sendMessage() {
            const content = document.getElementById('message-input').value;
            if (!content.trim() || !currentRoomId) return;

            const { data: { user } } = await supabaseClient.auth.getUser();
            const username = user.email.split('@')[0];

            const { error } = await supabaseClient
                .from('messages')
                .insert([{ user_name: username, content: content, room_id: currentRoomId }]);

            if (!error) {
                document.getElementById('message-input').value = '';
            } else {
                alert('发送失败: ' + error.message);
            }
        }

        async function updatePassword() {
            const newPassword = document.getElementById('new-password-input').value;
            if (!newPassword || newPassword.length < 6) {
                alert('密码长度不能少于 6 位！');
                return;
            }
            const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
            if (error) {
                alert('修改密码失败: ' + error.message);
            } else {
                alert('密码修改成功！');
                document.getElementById('new-password-input').value = '';
            }
        }

        function appendMessage(msg) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<span>${escapeHtml(msg.user_name)}:</span> ${escapeHtml(msg.content)}`;
            chatBox.appendChild(div);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
