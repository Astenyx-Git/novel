<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>加密创作讨论空间pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 根变量：默认浅色模式颜色 */
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --container-bg: #f9f9f9;
            --border-color: #ccc;
            --room-bg: #eee;
            --room-hover: #ddd;
            --room-active: #007bff;
            --room-active-text: #ffffff;
            --meta-color: #666;
            --msg-border: #eee;
            --input-bg: #ffffff;
            --input-text: #333333;
        }

        /* 暗色模式变量覆盖 */
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --container-bg: #242424;
            --border-color: #444;
            --room-bg: #2a2a2a;
            --room-hover: #3a3a3a;
            --room-active: #0d6efd;
            --room-active-text: #ffffff;
            --meta-color: #aaa;
            --msg-border: #333;
            --input-bg: #2d2d2d;
            --input-text: #e0e0e0;
        }

        body { 
            font-family: sans-serif; 
            max-width: 700px; 
            margin: 20px auto; 
            padding: 0 20px; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            transition: background-color 0.3s, color 0.3s;
            position: relative;
            min-height: 90vh;
        }

        /* 本地自定义背景图层及 85% 透明度锁定遮罩 */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.85; 
            z-index: -1;
            pointer-events: none;
        }

        .hidden { display: none !important; }
        .layout { display: flex; gap: 20px; }
        
        #room-list { width: 30%; border-right: 1px solid var(--border-color); padding-right: 10px; }
        #chat-main { width: 70%; position: relative; }
        
        .room-item { padding: 8px; margin-bottom: 5px; background: var(--room-bg); cursor: pointer; border-radius: 4px; }
        .room-item:hover { background: var(--room-hover); }
        .room-item.active { background: var(--room-active); color: var(--room-active-text); }
        
        /* 滚动条暗色模式优化 */
        #chat-box { 
            height: 350px; 
            border: 1px solid var(--border-color); 
            overflow-y: scroll; 
            padding: 10px; 
            margin-bottom: 10px; 
            background: var(--container-bg); 
        }
        #chat-box::-webkit-scrollbar { width: 8px; }
        #chat-box::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

        .message { margin-bottom: 10px; border-bottom: 1px dashed var(--msg-border); padding-bottom: 5px; position: relative; }
        .message span { font-weight: bold; color: var(--room-active); }
        
        /* 回复按钮样式 */
        .reply-btn { float: right; font-size: 11px; background: none; border: none; color: var(--meta-color); cursor: pointer; }
        .reply-btn:hover { color: var(--room-active); }

        /* 引用预览条样式 */
        #reply-preview-bar {
            background: var(--room-bg);
            border-left: 3px solid var(--room-active);
            padding: 5px 10px;
            margin-bottom: 5px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0 4px 4px 0;
        }

        /* 输入框暗色模式适配 */
        input[type="text"], input[type="password"], input[type="email"] {
            background-color: var(--input-bg);
            color: var(--input-text);
            border: 1px solid var(--border-color);
            padding: 6px;
            border-radius: 4px;
        }

        /* @ 提及高亮样式 */
        .mention { background-color: rgba(0, 123, 255, 0.15); padding: 2px 4px; border-radius: 3px; font-weight: bold; }
        [data-theme="dark"] .mention { background-color: rgba(13, 110, 253, 0.3); }

        /* @ 联想菜单样式 */
        #mention-dropdown {
            position: absolute;
            bottom: 50px;
            left: 0;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            max-height: 120px;
            overflow-y: auto;
            width: 150px;
            display: none;
            border-radius: 4px;
            z-index: 10;
        }
        .mention-option {
            padding: 6px 10px;
            cursor: pointer;
            font-size: 13px;
        }
        .mention-option:hover {
            background: var(--room-hover);
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <!-- 1. 登录视图 -->
    <div id="auth-section">
        <h2>空间登录 <button onclick="toggleTheme()" style="float: right; font-size: 12px; padding: 4px 8px;">🌓 切换主题</button></h2>
        <input type="email" id="email-input" placeholder="输入所有者分配的邮箱" style="width: 40%;" /><br><br>
        <input type="password" id="password-input" placeholder="输入密码" style="width: 40%;" /><br><br>
        <button onclick="login()">登录</button>
        <p id="auth-error" style="color: red;"></p>
    </div>

    <!-- 2. 聊天室主视图（登录后显示） -->
    <div id="chat-section" class="hidden">
        <div class="top-bar">
            <h2>小说创作空间 <span id="current-room-title" style="font-size: 16px; color: var(--meta-color); margin-left: 10px;"></span></h2>
            <div>
                <button onclick="toggleTheme()" style="font-size: 12px; margin-right: 5px;">🌓 主题</button>
                <button onclick="logout()" style="font-size: 12px;">退出登录</button>
            </div>
        </div>

        <div class="layout">
            <!-- 左侧：房间列表模块 -->
            <div id="room-list">
                <h3>讨论隔间</h3>
                <div id="rooms-container"></div>
            </div>

            <!-- 右侧：聊天及输入模块 -->
            <div id="chat-main">
                <div id="chat-box" onscroll="handleScroll()">请先在左侧选择一个房间</div>
                
                <!-- @ 联想弹窗列表 -->
                <div id="mention-dropdown"></div>

                <!-- 回复引用预览栏 -->
                <div id="reply-preview-bar" class="hidden">
                    <span id="reply-preview-text">正在回复...</span>
                    <button onclick="cancelReply()" style="background:none; border:none; cursor:pointer; font-weight:bold;">×</button>
                </div>

                <div id="input-area" class="hidden" style="display: flex; gap: 5px;">
                    <input type="text" id="message-input" placeholder="输入聊天内容... (输入 @ 可提及他人)" style="flex: 1;" autocomplete="off" />
                    <button onclick="sendMessage()">发送</button>
                </div>
            </div>
        </div>

        <!-- 修改密码与本地背景设置区 -->
        <div style="margin-top: 25px; padding: 10px; border: 1px dashed var(--border-color); display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
            <input type="password" id="new-password-input" placeholder="输入新密码 (至少6位)" style="width: 35%;" />
            <button onclick="updatePassword()">修改我的密码</button>
            <input type="file" id="bg-file-input" accept="image/*" class="hidden" onchange="handleBgUpload(event)" />
            <button onclick="document.getElementById('bg-file-input').click()">设置背景</button>
            <button onclick="clearBackground()">清除背景</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pctuwkfztzmhlgjkeuvl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_RVSfnyjPqLw5fn30Tlm3ig_XIgJipuG';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentRoomId = null;
        let currentSubscription = null;
        let oldestTimestamp = null; 
        let isLoadingMore = false;  
        let roomMembers = []; 
        let replyingToMessage = null; 

        checkUser();
        initTheme();
        initBackground();

        /* ==================== 1. 主题切换模块 (Dark Mode) ==================== */
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        /* ==================== 2. 本地自定义背景及智能压缩模块 ==================== */
        function initBackground() {
            const savedBg = localStorage.getItem('local_chat_bg');
            if (savedBg) {
                const styleSheet = document.styleSheets[0];
                try {
                    styleSheet.insertRule(`body::before { background-image: url(${savedBg}); }`, styleSheet.cssRules.length);
                } catch (e) {
                    let styleTag = document.getElementById('dynamic-bg-style');
                    if (!styleTag) {
                        styleTag = document.createElement('style');
                        styleTag.id = 'dynamic-bg-style';
                        document.head.appendChild(styleTag);
                    }
                    styleTag.innerHTML = `body::before { background-image: url(${savedBg}) !important; }`;
                }
            }
        }

        function handleBgUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const MAX_SIZE = 1920;

                    if (width > MAX_SIZE || height > MAX_SIZE) {
                        if (width > height) {
                            height = Math.round((height * MAX_SIZE) / width);
                            width = MAX_SIZE;
                        } else {
                            width = Math.round((width * MAX_SIZE) / height);
                            height = MAX_SIZE;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
                    localStorage.setItem('local_chat_bg', compressedBase64);
                    
                    let styleTag = document.getElementById('dynamic-bg-style');
                    if (!styleTag) {
                        styleTag = document.createElement('style');
                        styleTag.id = 'dynamic-bg-style';
                        document.head.appendChild(styleTag);
                    }
                    styleTag.innerHTML = `body::before { background-image: url(${compressedBase64}) !important; }`;
                    
                    alert('本地背景设置成功！');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearBackground() {
            localStorage.removeItem('local_chat_bg');
            let styleTag = document.getElementById('dynamic-bg-style');
            if (styleTag) styleTag.innerHTML = `body::before { background-image: none !important; }`;
            alert('已清除本地背景图！');
        }

        /* ==================== 3. 用户认证与基础逻辑 ==================== */
        async function checkUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) { showChatRoom(); }
        }

        async function login() {
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;
            const errorTag = document.getElementById('auth-error');

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                errorTag.innerText = '登录失败: ' + error.message;
            } else {
                showChatRoom();
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            document.getElementById('chat-section').classList.add('hidden');
            document.getElementById('auth-section').classList.remove('hidden');
        }

        function showChatRoom() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('chat-section').classList.remove('hidden');
            loadRooms();
        }

        /* ==================== 4. 房间加载与切换模块 ==================== */
        async function loadRooms() {
            const { data: rooms, error } = await supabaseClient.from('rooms').select('*').order('id');
            if (error) { console.error(error); return; }

            const container = document.getElementById('rooms-container');
            container.innerHTML = '';
            rooms.forEach(room => {
                const div = document.createElement('div');
                div.className = 'room-item';
                div.innerText = room.password ? `🔒 ${room.name}` : `💬 ${room.name}`;
                div.onclick = (e) => selectRoom(room, e.currentTarget);
                container.appendChild(div);
            });
        }

        async function selectRoom(room, element) {
            if (room.password) {
                const inputPwd = prompt(`【${room.name}】是加密房间，请输入访问密码：`);
                if (inputPwd !== room.password) {
                    alert('密码错误，拒绝进入！');
                    return;
                }
            }

            currentRoomId = room.id;
            oldestTimestamp = null;
            roomMembers = []; 
            cancelReply(); 
            
            // 💡 关键修复：进入新房间时，无论有没有历史消息，先无条件清空聊天框，防止上一房间内容混入
            document.getElementById('chat-box').innerHTML = '加载中...';
            
            document.getElementById('current-room-title').innerText = `- 当前隔间：${room.name}`;
            document.getElementById('input-area').classList.remove('hidden');

            document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            loadMessages(room.id, true);
            subscribeMessages(room.id);
        }

        /* ==================== 5. 消息加载与上划翻页模块 ==================== */
        async function loadMessages(roomId, isInitial = false) {
            const chatBox = document.getElementById('chat-box');
            
            let query = supabaseClient
                .from('messages')
                .select('*')
                .eq('room_id', roomId)
                .order('created_at', { ascending: false })
                .limit(50);

            if (!isInitial && oldestTimestamp) {
                query = query.lt('created_at', oldestTimestamp);
            }

            const { data, error } = await query;

            if (isInitial) {
                chatBox.innerHTML = ''; // 确保初始清空
            }

            if (!error && data && data.length > 0) {
                const sortedData = data.reverse();
                oldestTimestamp = sortedData[0].created_at; 

                sortedData.forEach(msg => {
                    if (msg.user_name && !roomMembers.includes(msg.user_name)) {
                        roomMembers.push(msg.user_name);
                    }
                });

                const previousHeight = chatBox.scrollHeight;

                if (isInitial) {
                    sortedData.forEach(msg => appendMessage(msg));
                    chatBox.scrollTop = chatBox.scrollHeight;
                } else {
                    const oldScrollTop = chatBox.scrollTop;
                    const tempDiv = document.createElement('div');
                    sortedData.forEach(msg => {
                        const div = createMessageElement(msg);
                        tempDiv.appendChild(div);
                    });

                    chatBox.insertBefore(tempDiv, chatBox.firstChild);
                    chatBox.scrollTop = chatBox.scrollHeight - previousHeight + oldScrollTop;
                }
            } else if (isInitial) {
                // 如果为空房间，显示友好提示
                chatBox.innerHTML = '<div style="color: var(--meta-color); text-align: center; margin-top: 20px;">这个隔间暂时还没有消息，快来发一条吧~</div>';
            }
            isLoadingMore = false;
        }

        function handleScroll() {
            const chatBox = document.getElementById('chat-box');
            if (chatBox.scrollTop === 0 && !isLoadingMore && currentRoomId) {
                isLoadingMore = true;
                loadMessages(currentRoomId, false);
            }
        }

        /* ==================== 6. 实时同步模块 ==================== */
        function subscribeMessages(roomId) {
            if (currentSubscription) {
                supabaseClient.removeChannel(currentSubscription);
            }
            currentSubscription = supabaseClient
                .channel(`room:${roomId}`)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${roomId}` }, payload => {
                    const chatBox = document.getElementById('chat-box');
                    // 如果当前显示的是空房间提示，先清空再追加
                    if (chatBox.innerHTML.includes('暂时还没有消息')) {
                        chatBox.innerHTML = '';
                    }
                    appendMessage(payload.new);
                    if (payload.new.user_name && !roomMembers.includes(payload.new.user_name)) {
                        roomMembers.push(payload.new.user_name);
                    }
                    chatBox.scrollTop = chatBox.scrollHeight;
                })
                .subscribe();
        }

        /* ==================== 7. 回复 (Reply) 交互功能 ==================== */
        function setReply(msg) {
            replyingToMessage = msg;
            const previewBar = document.getElementById('reply-preview-bar');
            const previewText = document.getElementById('reply-preview-text');
            
            const shortContent = msg.content.length > 25 ? msg.content.substring(0, 25) + '...' : msg.content;
            previewText.innerText = `回复 @${msg.user_name}: ${shortContent}`;
            previewBar.classList.remove('hidden');
            document.getElementById('message-input').focus();
        }

        function cancelReply() {
            replyingToMessage = null;
            document.getElementById('reply-preview-bar').classList.add('hidden');
        }

        /* ==================== 8. 消息发送与 @ 联动交互模块 ==================== */
        const messageInput = document.getElementById('message-input');
        const mentionDropdown = document.getElementById('mention-dropdown');

        messageInput.addEventListener('input', function() {
            const val = this.value;
            const cursorPos = this.selectionStart;
            const textBeforeCursor = val.substring(0, cursorPos);
            const match = textBeforeCursor.match(/@([^\s@]*)$/);

            if (match && roomMembers.length > 0) {
                const keyword = match[1].toLowerCase();
                const filteredMembers = roomMembers.filter(m => m.toLowerCase().includes(keyword));

                if (filteredMembers.length > 0) {
                    mentionDropdown.innerHTML = '';
                    filteredMembers.forEach(member => {
                        const opt = document.createElement('div');
                        opt.className = 'mention-option';
                        opt.innerText = `@${member}`;
                        opt.onclick = () => insertMention(member);
                        mentionDropdown.appendChild(opt);
                    });
                    mentionDropdown.style.display = 'block';
                    return;
                }
            }
            mentionDropdown.style.display = 'none';
        });

        function insertMention(username) {
            const val = messageInput.value;
            const cursorPos = messageInput.selectionStart;
            const textBeforeCursor = val.substring(0, cursorPos);
            const textAfterCursor = val.substring(cursorPos);

            const newTextBeforeCursor = textBeforeCursor.replace(/@([^\s@]*)$/, `@${username} `);
            messageInput.value = newTextBeforeCursor + textAfterCursor;
            mentionDropdown.style.display = 'none';
            messageInput.focus();
        }

        document.addEventListener('click', (e) => {
            if (e.target !== messageInput && !mentionDropdown.contains(e.target)) {
                mentionDropdown.style.display = 'none';
            }
        });

        async function sendMessage() {
            let content = messageInput.value;
            if (!content.trim() || !currentRoomId) return;

            if (replyingToMessage) {
                const quote = `> @${replyingToMessage.user_name}: ${replyingToMessage.content.replace(/\n/g, ' ')}\n\n`;
                content = quote + content;
            }

            const { data: { user } } = await supabaseClient.auth.getUser();
            const username = user.email.split('@')[0];

            const { error } = await supabaseClient
                .from('messages')
                .insert([{ 
                    user_name: username, 
                    content: content, 
                    room_id: currentRoomId 
                }]);

            if (!error) {
                messageInput.value = '';
                cancelReply();
                mentionDropdown.style.display = 'none';
            } else {
                alert('发送失败: ' + error.message);
            }
        }

        /* ==================== 9. 辅助工具与安全渲染模块 ==================== */
        async function updatePassword() {
            const newPassword = document.getElementById('new-password-input').value;
            if (!newPassword || newPassword.length < 6) {
                alert('密码长度不能少于 6 位！');
                return;
            }
            const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
            if (error) {
                alert('修改密码失败: ' + error.message);
            } else {
                alert('密码修改成功！');
                document.getElementById('new-password-input').value = '';
            }
        }

        function createMessageElement(msg) {
            const div = document.createElement('div');
            div.className = 'message';
            
            let safeContent = escapeHtml(msg.content);
            safeContent = safeContent.replace(/^&gt; (.*)$/gm, '<blockquote style="margin: 0 0 5px 0; padding-left: 8px; border-left: 2px solid var(--room-active); color: var(--meta-color); font-size: 12px;">$1</blockquote>');
            safeContent = safeContent.replace(/@([a-zA-Z0-9_\u4e00-\u9fa5]+)/g, '<span class="mention">@$1</span>');

            div.innerHTML = `
                <button class="reply-btn" onclick='setReply(${JSON.stringify(msg).replace(/'/g, "&#39;")})'>回复</button>
                <span>${escapeHtml(msg.user_name)}:</span> 
                <div style="margin-top: 4px;">${safeContent}</div>
            `;
            return div;
        }

        function appendMessage(msg) {
            const chatBox = document.getElementById('chat-box');
            const div = createMessageElement(msg);
            chatBox.appendChild(div);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
